name: Finalize Synthetiq hashes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize-hashes.mjs
      - run: node scripts/validate.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json modules/*/manifest.json
          git diff --cached --quiet || git commit -m "chore: finalize Synthetiq hashes"
          git push
